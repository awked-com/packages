name: Update nixpkgs
on:
  schedule:
    - cron: '41 5 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: update-nixpkgs
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - run: nix flake update nixpkgs
      - id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: update/nixpkgs
          title: 'deps: Update nixpkgs'
          commit-message: 'deps: Update nixpkgs'
          body: 'Review the Check workflow on this branch before merging.'
          add-paths: flake.lock
      - if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref update/nixpkgs
